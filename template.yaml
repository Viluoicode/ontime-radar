AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Shipment Tracking & Delivery SLA Service – multi-carrier webhooks, ordered processing
  (SQS FIFO), DynamoDB state + history, S3 event lake, late-delivery alerting, Olist replayer.

# ---------------------------------------------------------------------------
# Parameters – set them on the first `sam deploy --guided` (stored in samconfig.toml)
# ---------------------------------------------------------------------------
Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret carriers send in the X-Webhook-Secret header (min 16 chars).
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for SLA / DLQ alarms (leave empty to skip). Confirm the SNS email after deploy.
  ReplayState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Turn the 15-minute Olist replay schedule on/off.
  OrdersPerRun:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 200
    Description: Olist orders replayed per scheduler run.
  LateRatePercent:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
    Description: Alarm when the late-delivery RATE (%) reaches this in 2 of 3 consecutive 15-minute windows.
  MinDeliveries:
    Type: Number
    Default: 10
    MinValue: 1
    Description: A 15-minute window counts only with at least this many deliveries (1 late of 2 is not "50 % late").
  LocalDevOrigin:
    Type: String
    Default: "http://localhost:5500"
    AllowedPattern: "^http://localhost:[0-9]{2,5}$"
    Description: >
      Local copy of the website (py -m http.server) that may also log in and call the API,
      next to the CloudFront site. Only localhost is accepted.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

# Settings shared by every function.
Globals:
  Function:
    Runtime: dotnet10
    Architectures: [arm64]         # Graviton: ~20% cheaper than x86 for the same duration
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        TABLE_NAME: !Ref ShipmentsTable
  # Browser access for the dashboard. API Gateway answers CORS preflight (OPTIONS) itself.
  # Only read methods: carriers call the webhook server-to-server, so POST needs no CORS.
  HttpApi:
    CorsConfiguration:
      AllowOrigins:                       # only our website (CloudFront) and the local dev copy
        - !Sub "https://${WebDistribution.DomainName}"
        - !Ref LocalDevOrigin
      AllowMethods: [GET, OPTIONS]
      AllowHeaders: [authorization, content-type]
      MaxAge: 600
    # Every route needs a valid Cognito access token unless the route says Authorizer: NONE.
    # API Gateway verifies signature, expiry, issuer and client id → 401 before Lambda runs.
    # The role (cskh / manager) is checked in the API code (AccessRules) → 403.
    Auth:
      DefaultAuthorizer: CognitoJwt
      Authorizers:
        CognitoJwt:
          IdentitySource: $request.header.Authorization
          JwtConfiguration:
            issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
            audience: [!Ref UserPoolClient]

Resources:
  # ---------------- Users (Cognito) ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]                  # log in with email
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true             # no self sign-up: an admin creates staff accounts
      MfaConfiguration: OPTIONAL                   # users may turn on an authenticator app
      EnabledMfas: [SOFTWARE_TOKEN_MFA]            # no SMS (costs money + needs SMS sandbox exit)
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]

  CskhGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: cskh
      Description: "CSKH – look up shipments and lists"

  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: manager
      Description: "Quản lý – everything CSKH can do + SLA reports"

  # Public client (no secret): used by the website (login page, code + PKCE) and by scripts.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: dashboard
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED          # same error for "no such user" and "wrong password"
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }
      EnableTokenRevocation: true
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:                       # where the login page may send users back to
        - !Sub "https://${WebDistribution.DomainName}/"
        - !Sub "${LocalDevOrigin}/"
      LogoutURLs:
        - !Sub "https://${WebDistribution.DomainName}/"
        - !Sub "${LocalDevOrigin}/"

  # Cognito-hosted login page: https://<prefix>.auth.<region>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "${AWS::StackName}-${AWS::AccountId}"
      ManagedLoginVersion: 2

  LoginPageBranding:   # managed login v2 needs a style; use Cognito's default look
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  # ---------------- Storage ----------------
  ShipmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST   # on-demand: pay per request, no capacity planning
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false   # turn on for production; off keeps the lab cheap

  # One bucket: dataset/ (Olist chunks for the replayer) + events/ (event lake for Athena).
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DataBucketPolicy:   # refuse plain-HTTP access
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ---------------- Queue (FIFO = in-order per shipment) ----------------
  EventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600   # 14 days to investigate failures

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      VisibilityTimeout: 180            # ≥ 6 × processor timeout (AWS recommendation)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDlq.Arn
        maxReceiveCount: 5

  # ---------------- Functions ----------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/ShipmentSla.Api/
      Handler: ShipmentSla.Api        # executable assembly (Minimal API + Lambda hosting)
      Timeout: 29                     # HTTP API hard limit is 30 s (Athena queries need a few seconds)
      Environment:
        Variables:
          QUEUE_URL: !Ref EventsQueue
          WEBHOOK_SECRET: !Ref WebhookSecret
          ATHENA_DATABASE: !Ref LakeDatabase
          ATHENA_WORKGROUP: !Ref AthenaWorkGroup
      Policies:
        - SQSSendMessagePolicy: { QueueName: !GetAtt EventsQueue.QueueName }
        - DynamoDBReadPolicy: { TableName: !Ref ShipmentsTable }
        - S3CrudPolicy: { BucketName: !Ref DataBucket }   # read the lake + write Athena results (athena-results/)
        - Statement:
            - Effect: Allow
              Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults]
              Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"
            - Effect: Allow
              Action: [glue:GetDatabase, glue:GetTable, glue:GetPartitions]
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${LakeDatabase}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${LakeDatabase}/*"
      # Explicit methods instead of "ANY /{proxy+}": an ANY route would also catch the browser's
      # CORS preflight (OPTIONS) and send it to Lambda (→ 405). Without an OPTIONS route,
      # API Gateway answers preflight itself using CorsConfiguration (Globals).
      Events:
        ReadRoutes:                     # needs Cognito login (DefaultAuthorizer)
          Type: HttpApi                 # creates the implicit "ServerlessHttpApi"
          Properties:
            Path: /{proxy+}
            Method: GET
        HealthRoute:                    # public: uptime checks
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            Auth: { Authorizer: NONE }
        WebhookRoute:                   # carriers authenticate with X-Webhook-Secret, not Cognito
          Type: HttpApi
          Properties:
            Path: /carriers/{carrier}/webhook
            Method: POST
            Auth: { Authorizer: NONE }

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/ShipmentSla.Processor/
      Handler: ShipmentSla.Processor::ShipmentSla.Processor.Function::Handler
      Environment:
        Variables:
          LAKE_BUCKET: !Ref DataBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ShipmentsTable }
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        - CloudWatchPutMetricPolicy: {}
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]   # retry only failed messages
            # New accounts may only run 10 Lambdas at once in total. Without a cap the processor
            # takes all 10 (one per FIFO group) and the API gets throttled → 503 for carriers.
            ScalingConfig:
              MaximumConcurrency: 2

  ReplayerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/ShipmentSla.Replayer/
      Handler: ShipmentSla.Replayer::ShipmentSla.Replayer.Function::Handler
      Timeout: 120
      Environment:
        Variables:
          DATASET_BUCKET: !Ref DataBucket
          DATASET_PREFIX: dataset/chunks/
          CHUNK_SIZE: "500"
          ORDERS_PER_RUN: !Ref OrdersPerRun
          API_BASE_URL: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
          WEBHOOK_SECRET: !Ref WebhookSecret
      Policies:
        - S3ReadPolicy: { BucketName: !Ref DataBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref ShipmentsTable }
      Events:
        Every15Minutes:
          Type: ScheduleV2              # EventBridge Scheduler
          Properties:
            ScheduleExpression: rate(15 minutes)
            State: !Ref ReplayState
            Input: "{}"

  # Keep logs 14 days instead of forever (cost control).
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${ApiFunction}", RetentionInDays: 14 }
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${ProcessorFunction}", RetentionInDays: 14 }
  ReplayerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${ReplayerFunction}", RetentionInDays: 14 }

  # ---------------- Analytics: Glue catalog + Athena over s3://bucket/events/ ----------------
  LakeDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: shipment_sla_lake      # underscores only: Athena needs no quoting

  # Partition projection: Athena derives dt=YYYY-MM-DD itself → no crawler / MSCK REPAIR needed.
  EventsLakeTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref LakeDatabase
      TableInput:
        Name: events
        TableType: EXTERNAL_TABLE
        PartitionKeys:
          - { Name: dt, Type: string }
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2026-01-01,NOW"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${DataBucket}/events/dt=${!dt}/"
        StorageDescriptor:
          Location: !Sub "s3://${DataBucket}/events/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters: { "ignore.malformed.json": "true" }
          Columns:
            - { Name: eventid, Type: string }
            - { Name: shipmentid, Type: string }
            - { Name: carrier, Type: string }
            - { Name: trackingcode, Type: string }
            - { Name: orderid, Type: string }
            - { Name: status, Type: string }
            - { Name: rawstatus, Type: string }
            - { Name: occurredat, Type: string }
            - { Name: receivedat, Type: string }
            - { Name: processedat, Type: string }
            - { Name: region, Type: string }
            - { Name: location, Type: string }
            - { Name: estimateddelivery, Type: string }
            - { Name: outcome, Type: string }
            - { Name: reason, Type: string }
            - { Name: currentstatus, Type: string }
            - { Name: islate, Type: boolean }

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}-wg"
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824     # 1 GB cap → a runaway query cannot cost much
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DataBucket}/athena-results/"

  # ---------------- Website: private S3 bucket behind CloudFront ----------------
  # Separate from DataBucket: the website can never reach shipment data through S3.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:       # no public access at all – only CloudFront (OAC) can read
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadOnly        # only THIS distribution, signed with OAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Security headers on every response. The CSP mirrors web/index.html, plus frame-ancestors
  # (anti-clickjacking), which only works as a real header. Host wildcards (not exact refs)
  # avoid a CloudFormation cycle: the API's CORS already references this distribution.
  WebSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web-security"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Join ["; ", [
              "default-src 'self'",
              "script-src 'self' https://cdn.jsdelivr.net",
              "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com",
              "font-src https://fonts.gstatic.com",
              "img-src 'self' data:",
              !Sub "connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://*.auth.${AWS::Region}.amazoncognito.com",
              "base-uri 'self'",
              "form-action 'self'",
              "frame-ancestors 'none'"]]
          StrictTransportSecurity: { Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: no-referrer }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} dashboard"
        Enabled: true
        DefaultRootObject: index.html       # routes live in the #hash → no SPA rewrite needed
        HttpVersion: http2and3
        PriceClass: PriceClass_200          # includes Asia (Singapore, Vietnam edges); cheaper than All
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }   # empty = use OAC, not the legacy OAI
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # AWS managed "CachingOptimized"
          ResponseHeadersPolicyId: !Ref WebSecurityHeaders

  # ---------------- Alerting ----------------
  AlertTopic:
    Type: AWS::SNS::Topic

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Late-delivery RATE (not a raw count): rate = 100 × late / delivered per 15-minute window
  # (= one replayer run). Fires when 2 of the last 3 windows are at or above LateRatePercent,
  # so one unlucky window does not wake anyone up. Emails on ALARM and again when back to OK.
  LateDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub |
        Tỉ lệ giao trễ ≥ ${LateRatePercent}% trong 2/3 khung 15 phút gần nhất (chỉ tính khung có ≥ ${MinDeliveries} đơn đã giao).
        Việc cần làm: mở trang "Cần xử lý" để xem đơn trễ theo hãng và bang, báo CSKH liên hệ khách, kiểm tra hãng vận chuyển đang chậm.
        Dashboard: https://${WebDistribution.DomainName}/#/attention
      Metrics:
        - Id: late
          ReturnData: false
          MetricStat:
            Metric: { Namespace: ShipmentSla, MetricName: LateDeliveries, Dimensions: [{ Name: Service, Value: shipment-sla }] }
            Period: 900
            Stat: Sum
        - Id: delivered
          ReturnData: false
          MetricStat:
            Metric: { Namespace: ShipmentSla, MetricName: Deliveries, Dimensions: [{ Name: Service, Value: shipment-sla }] }
            Period: 900
            Stat: Sum
        - Id: rate
          Label: Late delivery rate (%)
          ReturnData: true
          Expression: !Sub "IF(delivered >= ${MinDeliveries}, 100 * FILL(late, 0) / delivered, 0)"
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref LateRatePercent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]          # "back to normal" email

  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Events failed 5 times and landed in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt EventsDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DataBucketName:
    Description: Upload the prepared Olist chunks to s3://<this>/dataset/chunks/
    Value: !Ref DataBucket
  TableName:
    Value: !Ref ShipmentsTable
  EventsQueueUrl:
    Value: !Ref EventsQueue
  EventsDlqUrl:
    Value: !Ref EventsDlq
  UserPoolId:
    Description: Create staff accounts here (see README "Đăng nhập")
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  LoginUrl:
    Description: Cognito-hosted login page (the website redirects here)
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=openid+email+profile&redirect_uri=https://${WebDistribution.DomainName}/"
  WebUrl:
    Description: The dashboard website
    Value: !Sub "https://${WebDistribution.DomainName}/"
  WebBucketName:
    Description: Website files (deploy with tools/deploy-web.ps1)
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
  LakeDatabaseName:
    Value: !Ref LakeDatabase
  ReplayerFunctionName:
    Description: Invoke manually for a test run before enabling the schedule
    Value: !Ref ReplayerFunction
