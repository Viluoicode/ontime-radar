AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GitHub Actions -> AWS without access keys (OIDC). Creates the GitHub OIDC provider and the role
  that .github/workflows/deploy.yml assumes to deploy the shipment-sla stack.
  Deploy ONCE from your machine (see README "Deploy tự động"); kept separate from the app stack so a
  failed app deploy can never remove its own deploy permissions.

Parameters:
  GitHubRepo:
    Type: String
    # GitHub's OIDC "sub" claim now carries immutable IDs: owner@<ownerId>/repo@<repoId>.
    # Matching the IDs (public, not secret) means a re-created repo with the same name cannot assume the role.
    # Find them in a failed AssumeRoleWithWebIdentity event in CloudTrail, or via the GitHub API.
    Default: Viluoicode@223611814/ontime-radar@1459692720
    Description: owner@ownerId/repo@repoId allowed to assume the role (as it appears in the OIDC sub claim)
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub environment (with required reviewers) the deploy job must run in
  AppStackName:
    Type: String
    Default: shipment-sla
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: '"false" if the account already has token.actions.githubusercontent.com'

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # ---------------- Permissions boundary for every role the APP stack creates ----------------
  # A boundary is a ceiling: a role can never do more than (its own policies ∩ this boundary).
  # The deploy role below may only create/change roles that carry THIS boundary, so even a stolen GitHub
  # token (or a malicious template change) cannot create e.g. an admin role and hand it to a Lambda.
  # It lives in this stack (not the app stack) so an app deploy can never loosen its own ceiling.
  # Template.yaml attaches it by name: arn:...:policy/${AppStackName}-boundary (Globals PermissionsBoundary).
  AppPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AppStackName}-boundary"
      Description: Maximum permissions of the shipment-sla Lambda / Scheduler roles
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*:*"
          - Sid: DynamoDb
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                     dynamodb:Query, dynamodb:Scan, dynamodb:BatchGetItem, dynamodb:BatchWriteItem,
                     dynamodb:ConditionCheckItem, dynamodb:DescribeTable]
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*/index/*"
          - Sid: Sqs
            Effect: Allow
            Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility,
                     sqs:GetQueueAttributes, sqs:GetQueueUrl]
            Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppStackName}-*"
          - Sid: S3
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject, s3:ListBucket,
                     s3:GetBucketLocation, s3:AbortMultipartUpload, s3:ListMultipartUploadParts,
                     s3:ListBucketMultipartUploads]
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-*"
              - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-*/*"
          - Sid: Athena
            Effect: Allow
            Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults,
                     athena:StopQueryExecution]
            Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AppStackName}-*"
          - Sid: Glue
            Effect: Allow
            Action: [glue:GetDatabase, glue:GetTable, glue:GetPartition, glue:GetPartitions]
            Resource:
              - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
              - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/shipment_sla_lake"
              - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/shipment_sla_lake/*"
          - Sid: Metrics                    # PutMetricData has no resource-level permissions
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
          - Sid: SchedulerInvokesReplayer
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Name deliberately does NOT start with "${AppStackName}-": the policy below may manage roles with that
  # prefix (the Lambda roles SAM creates), and must not be able to edit its own permissions.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "github-deploy-${AppStackName}"
      Description: Assumed by GitHub Actions (OIDC) to deploy the shipment-sla stack and website
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs of THIS repo running in the protected environment (= after a reviewer approved).
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: deploy-shipment-sla
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # --- CloudFormation: only the app stack + SAM's artifact-bucket stack ---
              - Sid: CloudFormationStacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: CloudFormationRead
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, cloudformation:ListStacks]
                Resource: "*"

              # --- IAM: only the roles SAM creates for this stack (names start with the stack name) ---
              # Creating a role or changing its permissions is allowed ONLY if the role has the boundary
              # (iam:PermissionsBoundary is the boundary the role has / will have after the call).
              - Sid: StackRolesWriteOnlyWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref AppPermissionsBoundary
              - Sid: StackRolesRead
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:DeleteRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*"
              - Sid: PassStackRolesToLambdaAndScheduler
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: [lambda.amazonaws.com, scheduler.amazonaws.com]
              # Explicit denies (stronger than any Allow): never remove a boundary, never edit the boundary.
              - Sid: NeverRemoveBoundary
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"
              - Sid: NeverEditBoundaryPolicy
                Effect: Deny
                Action: [iam:CreatePolicyVersion, iam:DeletePolicy, iam:DeletePolicyVersion, iam:SetDefaultPolicyVersion]
                Resource: !Ref AppPermissionsBoundary

              # --- Services the stack uses, scoped to stack-named resources where AWS allows it ---
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*"
              - Sid: LambdaEventSourceMappings
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:ListEventSourceMappings
                  - lambda:TagResource
                  - lambda:ListTags
                Resource: "*"
              - Sid: Sqs
                Effect: Allow
                Action: sqs:*
                Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AppStackName}-*"
              - Sid: DynamoDb
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*"
              - Sid: S3StackAndArtifactBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-*"
                  - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-*/*"
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*"
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*"
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*:*"
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Sns
                Effect: Allow
                Action: sns:*
                Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AppStackName}-*"
              - Sid: CloudWatchAlarms
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms, cloudwatch:TagResource,
                         cloudwatch:UntagResource, cloudwatch:ListTagsForResource]
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppStackName}-*"
              - Sid: CloudWatchDescribe
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: Glue
                Effect: Allow
                Action: glue:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/shipment_sla_lake"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/shipment_sla_lake/*"
              - Sid: Athena
                Effect: Allow
                Action: athena:*
                Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AppStackName}-*"
              - Sid: Scheduler
                Effect: Allow
                Action: scheduler:*
                Resource: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/*"
              # API Gateway, Cognito and CloudFront identify resources by generated IDs, not names,
              # so they can only be limited to the service (and region where the ARN has one).
              - Sid: ApiGateway
                Effect: Allow
                Action: apigateway:*
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/*"
              - Sid: Cognito
                Effect: Allow
                Action: cognito-idp:*
                Resource: "*"
              - Sid: CloudFront
                Effect: Allow
                Action: cloudfront:*
                Resource: "*"

Outputs:
  PermissionsBoundaryArn:
    Description: Boundary attached to every app role (template.yaml Globals → PermissionsBoundary)
    Value: !Ref AppPermissionsBoundary
  DeployRoleArn:
    Description: Put this in the GitHub environment secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
